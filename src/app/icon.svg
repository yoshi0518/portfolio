<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="terminalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"></stop>
    </linearGradient>
  </defs>

  <!-- Main terminal window -->
  <rect x="64" y="80" width="384" height="352" rx="32" fill="url(#terminalGradient)" stroke="#475569" stroke-width="2"></rect>

  <!-- Inner screen -->
  <rect x="80" y="96" width="352" height="320" rx="24" fill="#0f172a"></rect>

  <!-- Terminal header bar -->
  <rect x="80" y="96" width="352" height="48" rx="24" fill="#1e293b"></rect>
  <rect x="80" y="120" width="352" height="24" fill="#1e293b"></rect>

  <!-- Window controls -->
  <circle cx="112" cy="120" r="8" fill="#ef4444"></circle>
  <circle cx="144" cy="120" r="8" fill="#f59e0b"></circle>
  <circle cx="176" cy="120" r="8" fill="#10b981"></circle>

  <!-- Terminal content area -->
  <rect x="96" y="160" width="320" height="240" fill="#0f172a"></rect>

  <!-- Terminal prompt -->
  <text x="112" y="192" fill="#22d3ee" font-family="monospace" font-size="24" font-weight="bold">$</text>

  <!-- Cursor with animation -->
  <rect x="144" y="176" width="4" height="24" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"></animate>
  </rect>

  <!-- Command history lines -->
  <rect x="112" y="224" width="80" height="4" rx="2" fill="#06b6d4"></rect>
  <rect x="200" y="224" width="120" height="4" rx="2" fill="#0891b2"></rect>
  </svg>
